[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onrecord"
version = "0.1.0"
description = "50onrecord: caroselli Instagram automatici di storie musicali 1960-2010"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.6",
  "jinja2>=3.1",
  "playwright>=1.44",
  "requests>=2.31",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8", "responses>=0.25"]

[tool.setuptools]
packages = ["onrecord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
