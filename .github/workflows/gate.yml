# Cancello: controlla i caroselli scritti dalla routine (branch claude/...), genera le slide
# e mette in coda su main solo quelli che rispettano tutte le regole (spec §6–§7).
name: cancello

on:
  push:
    branches: ["claude/**"]

concurrency:
  group: scrittura-repo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python -m playwright install --with-deps chromium
      - name: Controlla e metti in coda
        run: |
          accepted=0
          for d in incoming/*/; do
            [ -f "$d/story.json" ] || continue
            if python -m onrecord build "$d"; then
              accepted=$((accepted + 1))
            else
              echo "::warning::Scartato: $d"
              rm -rf "$d"
            fi
          done
          echo "Caroselli accettati: $accepted"
          echo "accepted=$accepted" >> "$GITHUB_ENV"
      - name: Pubblica la coda su main
        if: env.accepted != '0'
        run: |
          git config user.name "50onrecord-bot"
          git config user.email "50onrecord-bot@users.noreply.github.com"
          git add -A queue incoming
          git commit -m "coda: nuovi caroselli da ${GITHUB_REF_NAME}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Elimina il branch della routine
        run: git push origin --delete "${GITHUB_REF_NAME}"
      - name: Nessun carosello valido
        if: env.accepted == '0'
        run: |
          echo "La routine non ha prodotto caroselli validi."
          exit 1
