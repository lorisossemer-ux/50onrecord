# Rinnovo settimanale del token Instagram (scade dopo 60 giorni se non rinnovato).
name: rinnova-token

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Rinnova il token
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python -m onrecord refresh-token --out-dir "$RUNNER_TEMP/token"
      - name: Aggiorna i segreti del repository
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set IG_TOKEN --repo "${{ github.repository }}" < "$RUNNER_TEMP/token/token.txt"
          gh secret set IG_TOKEN_EXPIRES --repo "${{ github.repository }}" < "$RUNNER_TEMP/token/expires.txt"
          rm -rf "$RUNNER_TEMP/token"
