# Sola lettura: elenca i post pubblicati sul profilo (tipo, data, link, didascalia) e li salva in
# instagram_media.json su main, così il registro delle uscite si aggiorna senza copiare a mano.
# Non pubblica nulla e non stampa mai il token. Si avvia a mano da Actions.
name: elenco-instagram

on:
  workflow_dispatch:

concurrency:
  group: elenco-instagram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  elenco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Legge i post del profilo
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python -m onrecord list-instagram
      - name: Salva l'elenco su main
        run: |
          git config user.name "50onrecord-bot"
          git config user.email "50onrecord-bot@users.noreply.github.com"
          git add instagram_media.json
          if git diff --cached --quiet; then
            echo "Nessuna novità."
          else
            git commit -m "registro: elenco dei post su Instagram"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
