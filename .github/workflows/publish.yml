# Pubblicazione: ogni 15 minuti controlla se c'è uno slot (12:30 / 20:30 ora di Roma) da coprire.
# Se fallisce, GitHub manda un'email al proprietario del repository (spec §9, avvisi).
name: pubblica

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      subito:
        description: "Pubblica subito, anche fuori dagli orari (solo avvio manuale)"
        type: boolean
        default: false
      carosello:
        description: "Id del carosello in coda da pubblicare (vuoto = il più vecchio)"
        type: string
        default: ""

concurrency:
  group: pubblica
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Pubblica se è il momento
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          ONRECORD_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
          # Variabile del repository: "true" finché l'utente non dà il via libera alla messa in onda.
          DRY_RUN: ${{ vars.ONRECORD_DRY_RUN }}
          SUBITO: ${{ inputs.subito }}
          CAROSELLO: ${{ inputs.carosello }}
        run: |
          # controllo.json (cambiato dal workflow "telecomando") ha la precedenza sulla variabile.
          MODO=""
          if [ -f controllo.json ]; then
            MODO=$(python -c "import json; print(json.load(open('controllo.json'))['modo'])")
          fi
          if [ -z "$MODO" ]; then
            if [ "$DRY_RUN" = "true" ]; then MODO=prova; else MODO=live; fi
          fi
          ARGS=()
          if [ "$SUBITO" = "true" ]; then ARGS+=(--now); fi
          if [ -n "$CAROSELLO" ]; then ARGS+=(--item "$CAROSELLO"); fi
          case "$MODO" in
            pausa) echo "Modalità pausa: nessuna pubblicazione." ;;
            prova) python -m onrecord publish --dry-run "${ARGS[@]}" ;;
            live) python -m onrecord publish "${ARGS[@]}" ;;
            *) echo "Modalità non valida in controllo.json: $MODO"; exit 1 ;;
          esac
      - name: Salva archivio e stato
        if: always()
        run: |
          git config user.name "50onrecord-bot"
          git config user.email "50onrecord-bot@users.noreply.github.com"
          # Questo job modifica solo archive/, queue/ e state.json: "git add -A" registra anche
          # lo spostamento dell'ultimo carosello quando la cartella queue/ si svuota.
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "pubblicazione: aggiorna archivio e stato"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep $((attempt * 10))
            done
            exit 1
          fi
